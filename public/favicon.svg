<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- 与 scripts/generate-icons.mjs 生成的 PNG 图标保持同一套视觉语言 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <g fill="#ffffff" fill-opacity="0.94">
    <!-- 第一行 4 个按键 -->
    <rect x="26" y="52" width="26" height="26" rx="7" />
    <rect x="62" y="52" width="26" height="26" rx="7" />
    <rect x="98" y="52" width="26" height="26" rx="7" />
    <rect x="134" y="52" width="26" height="26" rx="7" />
    <!-- 第二行 4 个按键 -->
    <rect x="26" y="88" width="26" height="26" rx="7" />
    <rect x="62" y="88" width="26" height="26" rx="7" />
    <rect x="98" y="88" width="26" height="26" rx="7" />
    <rect x="134" y="88" width="26" height="26" rx="7" />
    <!-- 第三行:一个按键 + 空格键 -->
    <rect x="26" y="124" width="26" height="26" rx="7" />
    <rect x="98" y="124" width="62" height="26" rx="7" />
  </g>
</svg>
